# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "SplitForge"

[setup]
script = '''
set +e

echo "== System =="
sw_vers
uname -m

echo "== Tooling =="
xcodebuild -version
xcode-select -p
git --version
java -version
node -v
npx -v

echo "== Android SDK =="
echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
echo "ANDROID_HOME=$ANDROID_HOME"
ls -la "$HOME/Library/Android/sdk" 2>/dev/null

echo "== Gradle (if present) =="
if [ -f "./gradlew" ]; then
  chmod +x ./gradlew
  ./gradlew --version
else
  echo "No ./gradlew yet (repo may not be generated yet)."
fi

exit 0

'''

[[actions]]
name = "Test"
icon = "test"
command = "./gradlew test"

[[actions]]
name = "Android Debug"
icon = "debug"
command = "./gradlew :androidApp:assembleDebug"

[[actions]]
name = "Android Lint"
icon = "tool"
command = "./gradlew :androidApp:lint"

[[actions]]
name = "iOS Simulator Build"
icon = "tool"
command = '''
set -euo pipefail

WORKSPACE="$(find iosApp -maxdepth 3 -name "*.xcworkspace" | head -n 1 || true)"
PROJECT="$(find iosApp -maxdepth 3 -name "*.xcodeproj" | head -n 1 || true)"

if [[ -n "${WORKSPACE}" ]]; then
  if [[ -z "${SCHEME:-}" ]]; then
    SCHEME="$(xcodebuild -list -workspace "${WORKSPACE}" | awk '/Schemes:/{flag=1;next} flag && NF{print; exit}' | xargs)"
  fi
  xcodebuild \
    -workspace "${WORKSPACE}" \
    -scheme "${SCHEME}" \
    -configuration Debug \
    -destination 'platform=iOS Simulator,name=iPhone 15' \
    -derivedDataPath build/DerivedData \
    build
elif [[ -n "${PROJECT}" ]]; then
  if [[ -z "${SCHEME:-}" ]]; then
    SCHEME="$(xcodebuild -list -project "${PROJECT}" | awk '/Schemes:/{flag=1;next} flag && NF{print; exit}' | xargs)"
  fi
  xcodebuild \
    -project "${PROJECT}" \
    -scheme "${SCHEME}" \
    -configuration Debug \
    -destination 'platform=iOS Simulator,name=iPhone 15' \
    -derivedDataPath build/DerivedData \
    build
else
  echo "No Xcode project/workspace found under iosApp/"
  exit 1
fi
'''
